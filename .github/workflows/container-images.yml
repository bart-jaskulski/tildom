name: Container images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      home: ${{ steps.filter.outputs.home }}
      mark: ${{ steps.filter.outputs.mark }}
      kin: ${{ steps.filter.outputs.kin }}
      hey: ${{ steps.filter.outputs.hey }}
      do: ${{ steps.filter.outputs.do }}
      api: ${{ steps.filter.outputs.api }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image inputs
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            home:
              - 'apps/home/**'
              - 'packages/config/**'
              - 'packages/ui/**'
              - 'apps/home/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            mark:
              - 'apps/mark/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/mark/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            kin:
              - 'apps/kin/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/kin/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            hey:
              - 'apps/hey/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/hey/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            do:
              - 'apps/do/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/ui/**'
              - 'apps/do/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            api:
              - 'services/api/**'
              - 'packages/config/**'
              - 'services/api/Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            sync:
              - 'services/sync/**'
              - 'packages/config/**'
              - 'services/sync/Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'

      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          IMAGE_HOME: ${{ steps.filter.outputs.home }}
          IMAGE_MARK: ${{ steps.filter.outputs.mark }}
          IMAGE_KIN: ${{ steps.filter.outputs.kin }}
          IMAGE_HEY: ${{ steps.filter.outputs.hey }}
          IMAGE_DO: ${{ steps.filter.outputs.do }}
          IMAGE_API: ${{ steps.filter.outputs.api }}
          IMAGE_SYNC: ${{ steps.filter.outputs.sync }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$REF_TYPE" = tag ]; then
            images='["home", "mark", "kin", "hey", "do", "api", "sync"]'
          else
            images="$(jq -cn \
              --arg home "$IMAGE_HOME" \
              --arg mark "$IMAGE_MARK" \
              --arg kin "$IMAGE_KIN" \
              --arg hey "$IMAGE_HEY" \
              --arg do "$IMAGE_DO" \
              --arg api "$IMAGE_API" \
              --arg sync "$IMAGE_SYNC" \
              '$ARGS.named | to_entries | map(select(.value == "true") | .key)')"
          fi

          matrix="$(jq -cn --argjson images "$images" '{include: [$images[] | {image: ., dockerfile: (if . == "api" or . == "sync" then "services/" + . + "/Dockerfile" else "apps/" + . + "/Dockerfile" end)}]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$images" = '[]' ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "name=${REGISTRY}/${owner}/${repo}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set build args
        id: build-args
        shell: bash
        env:
          MARK_SYNC_BASE_URL: ${{ vars.MARK_SYNC_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ "${{ matrix.image }}" = "mark" ]; then
            {
              echo "args<<EOF"
              echo "VITE_SYNC_BASE_URL=${MARK_SYNC_BASE_URL:-https://sync.tildom.app}"
              echo "VITE_API_BASE_URL=${API_BASE_URL:-https://api.tildom.app}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.image }}" = "do" ] || [ "${{ matrix.image }}" = "hey" ]; then
            {
              echo "args<<EOF"
              echo "VITE_API_BASE_URL=${API_BASE_URL:-https://api.tildom.app}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
