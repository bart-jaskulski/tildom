name: Container images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      home: ${{ steps.filter.outputs.home }}
      mark: ${{ steps.filter.outputs.mark }}
      kin: ${{ steps.filter.outputs.kin }}
      hey: ${{ steps.filter.outputs.hey }}
      do: ${{ steps.filter.outputs.do }}
      api: ${{ steps.filter.outputs.api }}
      sync: ${{ steps.filter.outputs.sync }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect image inputs
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            home:
              - 'apps/home/**'
              - 'packages/config/**'
              - 'packages/ui/**'
              - 'apps/home/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            mark:
              - 'apps/mark/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/mark/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            kin:
              - 'apps/kin/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/kin/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            hey:
              - 'apps/hey/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/markdownish/**'
              - 'packages/sync-client/**'
              - 'packages/ui/**'
              - 'apps/hey/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            do:
              - 'apps/do/**'
              - 'packages/browser-db/**'
              - 'packages/config/**'
              - 'packages/ui/**'
              - 'apps/do/Dockerfile'
              - 'docker/static-spa.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            api:
              - 'services/api/**'
              - 'packages/config/**'
              - 'services/api/Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'
            sync:
              - 'services/sync/**'
              - 'packages/config/**'
              - 'services/sync/Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/container-images.yml'

  build:
    name: Build ${{ matrix.image }}
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || needs.changes.outputs[matrix.image] == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: home
            dockerfile: apps/home/Dockerfile
          - image: mark
            dockerfile: apps/mark/Dockerfile
          - image: kin
            dockerfile: apps/kin/Dockerfile
          - image: hey
            dockerfile: apps/hey/Dockerfile
          - image: do
            dockerfile: apps/do/Dockerfile
          - image: api
            dockerfile: services/api/Dockerfile
          - image: sync
            dockerfile: services/sync/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "name=${REGISTRY}/${owner}/${repo}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set build args
        id: build-args
        shell: bash
        env:
          MARK_SYNC_BASE_URL: ${{ vars.MARK_SYNC_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ "${{ matrix.image }}" = "mark" ]; then
            {
              echo "args<<EOF"
              echo "VITE_SYNC_BASE_URL=${MARK_SYNC_BASE_URL:-https://sync.tildom.app}"
              echo "VITE_API_BASE_URL=${API_BASE_URL:-https://api.tildom.app}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.image }}" = "do" ] || [ "${{ matrix.image }}" = "hey" ]; then
            {
              echo "args<<EOF"
              echo "VITE_API_BASE_URL=${API_BASE_URL:-https://api.tildom.app}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
