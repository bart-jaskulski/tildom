services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "${API_PORT:-8788}:8788"
    environment:
      PORT: 8788
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      PUSH_STORAGE_ROOT: /app/storage
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:push@tildom.app}
    volumes:
      - push-storage:/app/storage
    restart: unless-stopped

  mark:
    build:
      context: .
      dockerfile: apps/mark/Dockerfile
      args:
        VITE_SYNC_BASE_URL: ${MARK_SYNC_BASE_URL:-http://localhost:8787}
        VITE_API_BASE_URL: ${MARK_API_BASE_URL:-http://localhost:8788}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

  sync:
    build:
      context: .
      dockerfile: services/sync/Dockerfile
    ports:
      - "${SYNC_PORT:-8787}:8787"
    environment:
      PORT: 8787
      SYNC_STORAGE_ROOT: /app/storage/vaults
      SYNC_TRUST_PROXY: ${SYNC_TRUST_PROXY:-true}
    volumes:
      - sync-storage:/app/storage
    restart: unless-stopped

  do:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/do/Dockerfile
      args:
        VITE_SYNC_BASE_URL: ${DO_SYNC_BASE_URL:-http://localhost:8787}
        VITE_API_BASE_URL: ${DO_API_BASE_URL:-http://localhost:8788}
    ports:
      - "${DO_APP_PORT:-3001}:3000"
    restart: unless-stopped

  kin:
    profiles:
      - apps
    build:
      context: .
      dockerfile: apps/kin/Dockerfile
      args:
        VITE_SYNC_BASE_URL: ${KIN_SYNC_BASE_URL:-http://localhost:8787}
        VITE_API_BASE_URL: ${KIN_API_BASE_URL:-http://localhost:8788}
    ports:
      - "${KIN_APP_PORT:-3002}:3000"
    restart: unless-stopped

volumes:
  sync-storage:
  push-storage:
