<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mark.tildom</title>
    <script>performance.mark?.("mark:boot:start")</script>
    <script>
      document.documentElement.dataset.bootRoute =
        location.pathname === "/" && !location.search
          ? "home"
          : (location.pathname.startsWith("/item/") || location.pathname.startsWith("/share-target/"))
            ? "item"
            : location.pathname === "/settings"
              ? "settings"
              : "other";
    </script>
    <style>
      * { box-sizing: border-box; border-radius: 0; }
      html { min-height: 100%; background: #fafafa; }
      body { min-height: 100%; margin: 0; color: #24292e; background: #fafafa; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; line-height: 1.45; }
      .boot-page { min-height: 100vh; background: #fafafa; }
      .boot-topbar { display: flex; align-items: stretch; justify-content: space-between; gap: 8px; width: 100%; max-width: 120ch; height: 48px; margin: 0 auto; padding-left: 1.5rem; border-bottom: 1px solid #e1e4e8; }
      .boot-brand { display: flex; align-items: center; min-width: 0; }
      .boot-title { display: flex; align-items: center; gap: 0.75rem; color: #d73a49; font-size: 16px; font-weight: 900; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
      .boot-logo { width: 24px; height: 24px; flex: none; }
      .boot-nav { display: flex; flex: 1 1 auto; align-items: stretch; min-width: 0; overflow-x: auto; scrollbar-width: none; }
      .boot-nav a { display: flex; align-items: center; min-height: 48px; padding: 0 2.2ch; color: #6a737d; font-size: 12px; text-decoration: none; white-space: nowrap; }
      [data-boot-route="home"] .boot-nav a:first-child, [data-boot-route="item"] .boot-nav a:first-child { border-bottom: 2px solid #d73a49; background: #fff; color: #24292e; font-weight: bold; }
      [data-boot-route="settings"] .boot-nav a:last-child { border-bottom: 2px solid #d73a49; background: #fff; color: #24292e; font-weight: bold; }
      .boot-search { position: relative; display: flex; align-items: center; width: 24ch; min-width: 24ch; margin-left: auto; border-left: 1px solid #e1e4e8; background: #fff; }
      .boot-search::before { position: absolute; top: 50%; left: 1.25ch; color: #d73a49; content: ">"; font-weight: bold; transform: translateY(-50%); }
      .boot-search input { width: 100%; min-height: 48px; padding: 0 1.5ch 0 3.5ch; border: 0; outline: 0; background: transparent; color: #24292e; font: inherit; font-size: 13px; opacity: 1; }
      .boot-search input::placeholder { color: #6a737d; opacity: 0.8; }
      .boot-search-toggle { display: none; }
      .boot-content { display: grid; gap: 1.5rem; width: 100%; max-width: 120ch; margin: 0 auto; padding: 1.5rem 3ch 2.5rem; }
      .boot-home, .boot-item-view, .boot-other { display: none; }
      [data-boot-route="home"] .boot-home { display: grid; gap: 1.5rem; }
      [data-boot-route="item"] .boot-item-view { display: grid; }
      [data-boot-route="settings"] .boot-other, [data-boot-route="other"] .boot-other { display: block; }
      .boot-form { width: 100%; max-width: 80ch; }
      .boot-textarea { width: 100%; min-height: 122px; padding: 0.75rem 1.5ch; border: 1px solid #e1e4e8; background: #fff; color: #6a737d; font-size: 13px; line-height: 1.5; }
      .boot-actions { display: grid; grid-template-columns: minmax(0, 5fr) minmax(44px, 1fr); gap: 1ch; margin: 2rem 0 1.25rem; }
      .boot-save { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 3ch; border: 2px solid #e1e4e8; background: #fff; color: #6a737d; cursor: not-allowed; font: inherit; font-size: 12px; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.6; }
      .boot-paste { padding: 0; }
      .boot-paste svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: square; stroke-linejoin: miter; stroke-width: 2; }
      .boot-mobile-bar { display: none; }
      .boot-list { min-height: 17rem; margin: 0; padding: 0; list-style: none; }
      .boot-list-item { display: grid; gap: 0.6rem; margin: 0 0 1.35rem; padding: 0.75rem 1.5ch; border-left: 2px solid #e1e4e8; }
      .boot-line { display: block; background: #dbedff; animation: boot-pulse 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate; }
      .boot-list-title { width: min(46ch, 68%); height: 1rem; }
      .boot-list-meta { width: min(31ch, 48%); height: 0.65rem; }
      .boot-list-preview { width: min(64ch, 88%); height: 0.75rem; }
      .boot-list-item:nth-child(2) .boot-list-title { width: min(35ch, 56%); }
      .boot-list-item:nth-child(2) .boot-list-preview { width: min(52ch, 76%); }
      .boot-list-item:nth-child(3) .boot-list-title { width: min(41ch, 62%); }
      .boot-list-item:nth-child(3) .boot-list-preview { width: min(58ch, 82%); }
      .boot-item-view { gap: 0.85rem; max-width: 75ch; padding-top: 0.35rem; }
      .boot-item-meta { width: min(28ch, 44%); height: 0.7rem; }
      .boot-item-title { width: min(52ch, 78%); height: 1.65rem; }
      .boot-item-url { width: min(42ch, 64%); height: 0.75rem; }
      .boot-item-body { width: min(68ch, 96%); height: 6rem; margin-top: 0.35rem; border-left: 2px solid #e1e4e8; }
      .boot-loading { margin: 0.75rem 0; padding: 0.75rem 1.5ch; border-left: 2px solid #6a737d; font-size: 13px; }
      .boot-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      @keyframes boot-pulse { from { opacity: 0.48; } to { opacity: 0.9; } }
      @media (max-width: 768px) {
        .boot-topbar { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 48px; grid-template-rows: 48px 48px; max-width: none; height: 96px; padding: 0; gap: 0; }
        .boot-brand { grid-column: 1; grid-row: 1; padding-left: 1.5ch; }
        .boot-nav { grid-column: 1 / -1; grid-row: 2; }
        .boot-nav a { flex: 1 0 auto; justify-content: center; padding: 0 1.5ch; }
        .boot-search { position: absolute; top: 0; right: 0; width: 48px; min-width: 48px; height: 48px; margin: 0; border-left: 0; overflow: hidden; }
        .boot-search::before, .boot-search input { display: none; }
        .boot-search-toggle { display: grid; width: 48px; height: 48px; margin-left: auto; padding: 0; border: 0; background: transparent; color: #24292e; place-items: center; }
        .boot-search-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: square; stroke-width: 2; }
        .boot-content { padding: 1.25rem 1.5ch 2rem; }
        .boot-save { width: 100%; }
      }
      @media (max-width: 640px) {
        [data-boot-route="home"] .boot-form { display: none; }
        [data-boot-route="home"] .boot-list { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
        [data-boot-route="home"] .boot-mobile-bar { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(44px, 1fr); gap: 1ch; padding: 0.75rem 1.5ch max(0.75rem, env(safe-area-inset-bottom)); border-top: 1px solid #e1e4e8; background: #fafafa; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-line { animation: none; opacity: 0.72; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-page">
        <header class="boot-topbar">
          <div class="boot-brand">
            <a href="/" class="boot-title">
              <img class="boot-logo" src="/icon.svg" alt="" aria-hidden="true" />
              <span>tildom</span>
            </a>
          </div>
          <nav class="boot-nav" aria-label="Primary">
            <a href="/">[ bookmarks.db ]</a>
            <a href="/settings">[ settings.json ]</a>
          </nav>
          <div class="boot-search" role="search">
            <input type="search" placeholder="search" aria-label="Search saved links" disabled />
            <button class="boot-search-toggle" type="button" aria-label="Search saved links" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
              </svg>
            </button>
          </div>
        </header>
        <main class="boot-content">
          <div class="boot-home">
            <div class="boot-form" aria-hidden="true">
              <div class="boot-textarea">Paste a link or write a note</div>
              <div class="boot-actions">
                <button class="boot-save" type="button" disabled>save</button>
                <button class="boot-save boot-paste" type="button" aria-label="Save copied link" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5h6m-7 3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h7m3-16a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2h8V5Zm1 9v6m-3-3h6" />
                  </svg>
                </button>
              </div>
            </div>
            <section role="status" aria-live="polite">
              <span class="boot-sr">Opening local library</span>
              <ol class="boot-list" aria-hidden="true">
                <li class="boot-list-item">
                  <span class="boot-line boot-list-title"></span>
                  <span class="boot-line boot-list-meta"></span>
                  <span class="boot-line boot-list-preview"></span>
                </li>
                <li class="boot-list-item">
                  <span class="boot-line boot-list-title"></span>
                  <span class="boot-line boot-list-meta"></span>
                  <span class="boot-line boot-list-preview"></span>
                </li>
                <li class="boot-list-item">
                  <span class="boot-line boot-list-title"></span>
                  <span class="boot-line boot-list-meta"></span>
                  <span class="boot-line boot-list-preview"></span>
                </li>
              </ol>
            </section>
            <div class="boot-mobile-bar" aria-hidden="true">
              <button class="boot-save" type="button" disabled>add link</button>
              <button class="boot-save boot-paste" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 5h6m-7 3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h7m3-16a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2h8V5Zm1 9v6m-3-3h6" />
                </svg>
              </button>
            </div>
          </div>
          <article class="boot-item-view" role="status" aria-live="polite">
            <span class="boot-sr">Loading item</span>
            <span class="boot-line boot-item-meta" aria-hidden="true"></span>
            <span class="boot-line boot-item-title" aria-hidden="true"></span>
            <span class="boot-line boot-item-url" aria-hidden="true"></span>
            <span class="boot-line boot-item-body" aria-hidden="true"></span>
          </article>
          <p class="boot-loading boot-other" role="status">Opening local view...</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
